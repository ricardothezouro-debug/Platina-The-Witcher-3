<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><rect width="1100" height="330" rx="18" fill="#111B2C" stroke="#43506A"/><g font-family="Segoe UI, sans-serif"><text x="30" y="42" fill="#37F2FF" font-size="20" font-weight="700">ESCOLA DO GRIFO • SEIS PEÇAS</text><text x="30" y="69" fill="#B1C2D8" font-size="14">Leia o mapa de Edwin Greloff para abrir a caça ao tesouro e seus marcadores.</text><rect x="30" y="103" width="250" height="183" rx="14" fill="#152A3A" stroke="#37F2FF"/><text x="46" y="135" fill="#37F2FF" font-size="15" font-weight="700">HINDHOLD</text><text x="46" y="170" fill="#E0E8F2" font-size="14">Andar superior</text><text x="46" y="197" fill="#E0E8F2" font-size="14">1 espada de aço</text><rect x="295" y="103" width="250" height="183" rx="14" fill="#291D37" stroke="#FF4FD8"/><text x="311" y="135" fill="#37F2FF" font-size="15" font-weight="700">LORNRUK</text><text x="311" y="170" fill="#E0E8F2" font-size="14">Complexo do farol</text><text x="311" y="197" fill="#E0E8F2" font-size="14">1 espada de prata</text><rect x="560" y="103" width="250" height="183" rx="14" fill="#152A3A" stroke="#37F2FF"/><text x="576" y="135" fill="#37F2FF" font-size="15" font-weight="700">DRAGONSLAYER'S GROTTO</text><text x="576" y="170" fill="#E0E8F2" font-size="14">Cripta</text><text x="576" y="197" fill="#E0E8F2" font-size="14">4 peças de armadura</text><rect x="825" y="103" width="250" height="183" rx="14" fill="#291D37" stroke="#FF4FD8"/><text x="841" y="135" fill="#37F2FF" font-size="15" font-weight="700">FABRICAR + EQUIPAR</text><text x="841" y="170" fill="#E0E8F2" font-size="14">Ferreiro e armeiro</text><text x="841" y="197" fill="#E0E8F2" font-size="14">As seis peças juntas</text></g></svg>
