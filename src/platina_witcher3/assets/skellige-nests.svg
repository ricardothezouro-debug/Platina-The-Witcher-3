<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><rect width="1100" height="330" rx="18" fill="#111B2C" stroke="#43506A"/><g font-family="Segoe UI, sans-serif"><text x="30" y="42" fill="#37F2FF" font-size="20" font-weight="700">SKELLIGE • 5 NINHOS PARA DEDETIZAÇÃO</text><text x="30" y="69" fill="#B1C2D8" font-size="14">Use as placas de viagem rápida como referência. Destrua o ninho com uma bomba.</text><rect x="30" y="103" width="250" height="183" rx="14" fill="#152A3A" stroke="#37F2FF"/><text x="46" y="135" fill="#37F2FF" font-size="15" font-weight="700">01 + 02 • COSTA OESTE</text><text x="46" y="170" fill="#E0E8F2" font-size="14">Crossroads</text><text x="46" y="197" fill="#E0E8F2" font-size="14">Naufrágio a sudoeste</text><text x="46" y="224" fill="#E0E8F2" font-size="14">Costa a sul/sudeste</text><text x="46" y="251" fill="#E0E8F2" font-size="14">Ard Skellig</text><rect x="295" y="103" width="250" height="183" rx="14" fill="#291D37" stroke="#FF4FD8"/><text x="311" y="135" fill="#37F2FF" font-size="15" font-weight="700">03 • COSTA LESTE</text><text x="311" y="170" fill="#E0E8F2" font-size="14">Ruined Inn</text><text x="311" y="197" fill="#E0E8F2" font-size="14">Dentro das ruínas</text><text x="311" y="224" fill="#E0E8F2" font-size="14">Ard Skellig</text><rect x="560" y="103" width="250" height="183" rx="14" fill="#152A3A" stroke="#37F2FF"/><text x="576" y="135" fill="#37F2FF" font-size="15" font-weight="700">04 • SUL</text><text x="576" y="170" fill="#E0E8F2" font-size="14">Fort Grymmdjarr</text><text x="576" y="197" fill="#E0E8F2" font-size="14">Sudoeste de Fyresdal</text><text x="576" y="224" fill="#E0E8F2" font-size="14">Ard Skellig</text><rect x="825" y="103" width="250" height="183" rx="14" fill="#291D37" stroke="#FF4FD8"/><text x="841" y="135" fill="#37F2FF" font-size="15" font-weight="700">05 • ILHA NORTE</text><text x="841" y="170" fill="#E0E8F2" font-size="14">Bay of Winds</text><text x="841" y="197" fill="#E0E8F2