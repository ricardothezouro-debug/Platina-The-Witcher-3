  <text x="45" y="138" fill="#ACB8CA" font-family="Segoe UI, sans-serif" font-size="13">Pomar + Vizima</text>
  <rect x="260" y="82" width="205" height="86" rx="10" fill="#151A2B" stroke="#7C7AFF"/>
  <text x="277" y="111" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Mundo aberto</text>
  <text x="277" y="137" fill="#ACB8CA" font-family="Segoe UI, sans-serif" font-size="13">3 regiões, ordem livre</text>
  <rect x="551" y="82" width="204" height="86" rx="10" fill="#251729" stroke="#FF4FD8"/>
