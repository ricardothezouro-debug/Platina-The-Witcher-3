[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platina-witcher3"
version = "0.1.0"
description = "Guia de platina de The Witcher 3 para o Streamer Sidekick"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platina_witcher3 = ["assets/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
